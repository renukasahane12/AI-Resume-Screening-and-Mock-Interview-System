<!DOCTYPE html>
<html>
<head>
    <title>AI Mock Interview</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:40px;
        }

        .box{
            width:70%;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        textarea{
            width:100%;
            height:180px;
            margin-top:15px;
            padding:10px;
            font-size:16px;
        }

        button{

            padding:12px 25px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            margin-top:20px;

        }

    </style>

</head>

<body>

<div class="box">
    <h2>AI Mock Interview</h2>
<p style="text-align:center; color:#666; font-size:18px;">
    Question {{ current + 1 }} of {{ total }}
</p>

<h3>Question {{ current + 1 }}</h3>

<div class="question-box">
    {{ question }}
</div>

<form action="/evaluate" method="post">

<input type="hidden" name="question" value="{{ question }}">

<textarea
name="answer"
placeholder="Type your answer here..."
required></textarea>

<br>

<button type="submit">

Submit Answer

</button>

</form>

</div>

</body>
</html>
